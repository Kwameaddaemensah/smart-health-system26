# frontend/pubspec.yaml

name: smart_health_care
description: Smart Health Care — AI-guided health platform for Android and Web.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State management ────────────────────────────────────────────
  # Riverpod: compile-safe providers, AsyncValue, autoDispose
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # ── Navigation ──────────────────────────────────────────────────
  # GoRouter: declarative routing with ShellRoutes for bottom nav
  go_router: ^17.2.0

  # ── Networking ──────────────────────────────────────────────────
  # Dio: HTTP client. Supports interceptors and streaming (for AI chat)
  dio: ^5.9.2

  # ── Data models ─────────────────────────────────────────────────
  # Freezed: generates immutable classes with copyWith, equality, JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # ── Storage ─────────────────────────────────────────────────────
  # SecureStorage: AES Keystore (Android) / Keychain (iOS) for JWT tokens
  flutter_secure_storage: ^10.0.0
  # SharedPreferences: non-sensitive key-value (theme, onboarding flag)
  shared_preferences: ^2.5.5
  # Hive: fast encrypted offline cache for appointments, doctor list
  hive_flutter: 1.1.0

  # ── Firebase ────────────────────────────────────────────────────
  firebase_core: ^4.6.0
  firebase_analytics: ^12.2.0
  firebase_messaging: ^16.1.3

  # ── Maps & Location ─────────────────────────────────────────────
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2

  # ── UI utilities ────────────────────────────────────────────────
  # shimmer: skeleton loading placeholders
  shimmer: 3.0.0
  # cached_network_image: efficient remote image loading with cache
  cached_network_image: 3.4.1
  # file_picker: record upload (PDF, JPG, PNG)
  file_picker: ^11.0.2
  # url_launcher: open maps app from facility screen
  url_launcher: ^6.3.2
  # intl: date/time formatting, locale support
  intl: ^0.20.2
  # connectivity_plus: detect offline state before API calls
  connectivity_plus: ^7.1.0
  # permission_handler: request location permission
  permission_handler: ^12.0.1

  # ── Functional helpers ──────────────────────────────────────────
  # dartz: Either<Failure, T> in repositories
  dartz: 0.10.1
  # uuid: generate session IDs for AI chat
  uuid: ^4.5.3
  # equatable: value equality for non-Freezed classes
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3

  # Testing
  mocktail: ^1.0.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
          weight: 400
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700